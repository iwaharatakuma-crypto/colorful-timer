<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラフルタイマー</title>

<!-- タブやブックマーク用のアイコン -->
  <link rel="icon" type="image/png" href="icon.png">
  <!-- スマホ・Chromebookのホーム画面用アイコン -->
  <link rel="apple-touch-icon" href="icon.png">
  <!-- ★ここまで追加★ -->
  
  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  
  <!-- アイコン設定（自作した icon.png をアップロードして同階層に配置してください） -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tone.js for Sound Synthesizer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts for Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
    }
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body class="bg-black text-white min-h-[100dvh] flex flex-col justify-between md:justify-start items-center p-2 sm:p-4 md:p-6 no-select">

  <!-- ヘッダーエリア -->
  <header class="relative flex justify-center items-center w-full max-w-5xl mx-auto mb-2 md:mb-4 py-1">
    <h1 id="app-title" class="text-base sm:text-xl md:text-3xl font-light tracking-wider text-center rainbow-text">
      カラフルタイマー
    </h1>
    <div class="absolute right-0 flex items-center gap-1.5 sm:gap-2 md:gap-4">
      <button id="btn-lang" onclick="toggleLanguage()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white font-bold py-1 px-2.5 sm:py-1.5 sm:px-3 md:py-2 md:px-4 rounded-full border-2 border-zinc-600 text-xs sm:text-sm md:text-base transition-transform">
        ひらがな
      </button>
      <button id="btn-sound" onclick="toggleSound()" class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white font-bold py-1 px-2.5 sm:py-1.5 sm:px-3 md:py-2 md:px-4 rounded-full border-2 border-zinc-600 text-xs sm:text-sm md:text-base flex items-center gap-1 sm:gap-2 transition-transform">
        <span id="sound-icon">🔊</span>
        <span id="sound-text">おとあり</span>
      </button>
    </div>
  </header>

  <!-- メインエリア -->
  <main class="flex flex-col justify-start items-center w-full max-w-5xl mx-auto gap-2 sm:gap-4 mt-0 my-auto">
    <div class="flex flex-col md:flex-row items-center gap-2 sm:gap-4 md:gap-6 w-full">
      <div class="w-full md:w-3/5 h-24 sm:h-36 md:h-52 bg-black border-2 sm:border-4 border-zinc-800 relative rounded-none p-1 flex flex-row gap-1 overflow-hidden">
        <div id="bar-container" class="w-full h-full flex flex-row gap-1"></div>
      </div>
      <div class="w-full md:w-2/5 h-28 sm:h-36 md:h-52 bg-black border-2 sm:border-4 border-zinc-900 rounded-none flex items-center justify-center p-2 sm:p-3 relative overflow-hidden">
        <div class="flex items-center justify-center gap-1 sm:gap-2 w-full">
          <div class="flex flex-col items-center">
            <div class="flex gap-1.5 sm:gap-2 md:gap-3" id="display-minutes-seg"></div>
            <span id="label-minutes" class="text-sm sm:text-lg md:text-2xl mt-0.5 sm:mt-1 text-yellow-400 font-extrabold tracking-wide">ふん</span>
          </div>
          <div class="flex flex-col items-center justify-start self-start pt-1 sm:pt-2">
            <svg class="w-[9px] h-[18px] sm:w-[11px] sm:h-[22px] md:w-[18px] md:h-[36px]" viewBox="0 0 20 40" style="shape-rendering: crispEdges;">
              <path d="M 4,2 L 16,2 L 10,16 L 2,16 Z" fill="#ffff00" />
            </svg>
          </div>
          <div class="flex flex-col items-center">
            <div class="flex gap-1.5 sm:gap-2 md:gap-3" id="display-seconds-seg"></div>
            <span id="label-seconds" class="text-sm sm:text-lg md:text-2xl mt-0.5 sm:mt-1 text-yellow-400 font-extrabold tracking-wide">びょう</span>
          </div>
        </div>
      </div>
    </div>

    <!-- コントロールエリア -->
    <div class="w-full bg-zinc-900 border-2 border-zinc-800 p-3 sm:p-4 md:p-6 rounded-2xl flex flex-col gap-3 sm:gap-4">
      <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 md:gap-3">
        <span id="label-add-time" class="w-full text-center sm:w-auto text-zinc-400 font-bold text-xs sm:text-sm md:text-base mr-0 sm:mr-2 mb-1 sm:mb-0">じかんをたす:</span>
        <button onclick="addSeconds(30)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+30<span class="unit-sec">びょう</span></button>
        <button onclick="addMinutes(1)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+1<span class="unit-min">ふん</span></button>
        <button onclick="addMinutes(3)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+3<span class="unit-min">ふん</span></button>
        <button onclick="addMinutes(5)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+5<span class="unit-min">ふん</span></button>
        <button onclick="addMinutes(10)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+10<span class="unit-min">ふん</span></button>
        <button onclick="addMinutes(30)" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-yellow-400 font-extrabold py-1.5 px-2.5 sm:px-3 md:px-4 text-sm md:text-lg border-2 border-yellow-500/50 rounded-full transition-transform">+30<span class="unit-min">ふん</span></button>
      </div>

      <div class="flex justify-center gap-2 md:gap-4 mt-1 sm:mt-2">
        <button id="btn-start" onclick="toggleTimer()" class="w-5/12 md:w-1/3 bg-green-600 hover:bg-green-500 active:bg-green-700 active:scale-95 text-white font-black py-2.5 sm:py-3 md:py-4 text-lg sm:text-xl md:text-2xl border-2 sm:border-4 border-green-400 rounded-full shadow-lg transition-transform">はじめる</button>
        <button id="btn-reset" onclick="resetTimer()" class="w-3/12 md:w-1/4 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 active:scale-95 text-zinc-300 font-bold py-2.5 sm:py-3 md:py-4 text-base sm:text-lg md:text-xl border-2 border-zinc-600 rounded-full transition-transform">やりなおす</button>
        <button onclick="clearTimer()" class="w-4/12 md:w-1/4 bg-red-950 hover:bg-red-900 active:bg-red-800 active:scale-95 text-red-200 font-extrabold py-2.5 sm:py-3 md:py-4 text-base sm:text-lg md:text-xl border-2 border-red-600 rounded-full transition-transform"><span id="btn-text-clear">ぜんぶけす</span></button>
      </div>
    </div>
  </main>

  <script>
    // 既存のJSロジックと同一のため、ここから先は前のコードを適用してください
    // 各種音声アナウンス関数
    // すべての関数内で最初に speechSynthesis.cancel() を呼び、現在再生中の音声を停止してから新しい音声を再生します
    function speakStartNotice() {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 進行中の音声を中断
        const text = isHiragana ? 'はじめ！' : 'スタート！';
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.2;
        uttr.pitch = 1.25;
        window.speechSynthesis.speak(uttr);
      }
    }

    function speakHalfwayNotice() {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = isHiragana ? 'のこり、はんぶん' : '残り、半分';
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
      }
    }

    function speak5MinNotice() {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = isHiragana ? 'のこり、５ふん' : '残り、5分';
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
      }
    }

    function speak1MinNotice() {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = isHiragana ? 'のこり、いっぷん' : '残り、1分';
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
      }
    }

    function speakFinishNotice() {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 終了時は特に、他の通知をすべてキャンセルして優先する
        const text = isHiragana ? 'おわりです。おつかれさまでした。' : '終わりです。お疲れ様でした。';
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
      }
    }

  </script>
</body>
</html>
